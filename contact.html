<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact - Tylar Killarney</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="MainWindow">

    <div class="pageButtons">
      <div class="logo">Tylar Killarney</div>
      <ul class="mainPage">
        <li><a class="linkButton" href="index.html">Home</a></li>
        <li><a class="linkButton" href="about.html">About</a></li>
        <li><a class="linkButton" href="projects.html">Projects</a></li>
        <li><a class="linkButton active" href="contact.html">Contact</a></li>
      </ul>
    </div>

    <div class="main">
      <div class="contactBox">
        <h1>Contact Me</h1>
        <p>Shoot me a message!</p>

        <form id="contactForm">
          <label for="name">Name</label>
          <input type="text" id="name">

          <label for="email">Email</label>
          <input type="email" id="email">

          <label for="message">Message</label>
          <textarea id="message" rows="6"></textarea>

          <button type="submit" class="buttons">Send</button>
        </form>
      </div>
    </div>

  </div>

  <p class="designedbyLabel">/Designed by Tylar\</p>

  <script src="website.js"></script>
</body>
</html>
